name: portal-libre-expresion-dev

x-api-environment: &api-environment
  ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
  ASPNETCORE_HTTP_PORTS: "8080"
  ConnectionStrings__PortalDb: Host=db;Port=5432;Database=${POSTGRES_DB:?POSTGRES_DB is required};Username=${POSTGRES_USER:?POSTGRES_USER is required};Password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
  DATABASE_SEEDING_ENABLED: "false"

services:
  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - portal_postgres_data:/var/lib/postgresql
    networks:
      - portal-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    stop_grace_period: 30s

  api:
    build:
      context: .
      dockerfile: deploy/docker/backend.Dockerfile
      target: runtime
    restart: unless-stopped
    environment: *api-environment
    expose:
      - "8080"
    volumes:
      - portal_api_keys:/home/app/.aspnet/DataProtection-Keys
    tmpfs:
      - /tmp
    read_only: true
    depends_on:
      db:
        condition: service_healthy
    networks:
      - portal-network

  web:
    build:
      context: .
      dockerfile: deploy/docker/frontend.Dockerfile
      target: runtime
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      api:
        condition: service_started
    networks:
      - portal-network

  migrate:
    profiles: ["tools"]
    build:
      context: .
      dockerfile: deploy/docker/backend.Dockerfile
      target: migrate
    restart: "no"
    environment: *api-environment
    depends_on:
      db:
        condition: service_healthy
    networks:
      - portal-network

  provision:
    profiles: ["tools"]
    build:
      context: .
      dockerfile: deploy/docker/backend.Dockerfile
      target: runtime
    restart: "no"
    environment:
      <<: *api-environment
      PORTAL_OPERATION: provision
      DATABASE_SEEDING_ENABLED: "true"
      SUPERADMIN_DOCUMENT: ${SUPERADMIN_DOCUMENT:-}
      SUPERADMIN_FIRST_NAME: ${SUPERADMIN_FIRST_NAME:-}
      SUPERADMIN_LAST_NAME: ${SUPERADMIN_LAST_NAME:-}
      SUPERADMIN_EMAIL: ${SUPERADMIN_EMAIL:-}
    volumes:
      - portal_api_keys:/home/app/.aspnet/DataProtection-Keys
    tmpfs:
      - /tmp
    read_only: true
    depends_on:
      db:
        condition: service_healthy
    networks:
      - portal-network

volumes:
  portal_postgres_data:
    external: true
    name: portal-dev-pgdata
  portal_api_keys:
    name: portal-libre-expresion-dev-api-keys

networks:
  portal-network:
    name: portal-libre-expresion-dev-network
    driver: bridge
    ipam:
      config:
        - subnet: 172.29.10.0/24
